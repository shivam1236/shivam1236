name: Generate Stats Card
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Stats SVG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Fetch user data
            const { data: user } = await github.rest.users.getByUsername({ username: 'shivam1236' });

            // Fetch repos
            const { data: repos } = await github.rest.repos.listForUser({
              username: 'shivam1236',
              per_page: 100,
              sort: 'updated'
            });

            // Calculate stats
            const totalStars = repos.reduce((sum, repo) => sum + repo.stargazers_count, 0);
            const totalForks = repos.reduce((sum, repo) => sum + repo.forks_count, 0);
            const totalRepos = repos.length;
            const followers = user.followers;
            const following = user.following;

            // Get languages
            const langMap = {};
            for (const repo of repos.slice(0, 20)) {
              try {
                const { data: langs } = await github.rest.repos.listLanguages({
                  owner: 'shivam1236',
                  repo: repo.name
                });
                for (const [lang, bytes] of Object.entries(langs)) {
                  langMap[lang] = (langMap[lang] || 0) + bytes;
                }
              } catch (e) {}
            }
            const topLangs = Object.entries(langMap)
              .sort((a, b) => b[1] - a[1])
              .slice(0, 5);
            const totalBytes = topLangs.reduce((s, [, b]) => s + b, 0);

            // Language colors
            const langColors = {
              'Python': '#3776AB', 'JavaScript': '#F7DF1E', 'TypeScript': '#3178C6',
              'Java': '#ED8B00', 'Go': '#00ADD8', 'Shell': '#4EAA25', 'Bash': '#4EAA25',
              'HCL': '#844FBA', 'Dockerfile': '#2496ED', 'HTML': '#E34F26',
              'CSS': '#1572B6', 'C++': '#00599C', 'Rust': '#DEA584', 'Ruby': '#CC342D',
              'Jupyter Notebook': '#F37626', 'YAML': '#CB171E', 'Makefile': '#427819'
            };

            // Generate SVG
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320">
              <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
                </linearGradient>
                <filter id="glow">
                  <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                  <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
                <style>
                  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
                  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
                  @keyframes slideRight { from { width: 0; } }
                  .stat-row { animation: fadeIn 0.5s ease forwards; opacity: 0; }
                  .stat-row:nth-child(1) { animation-delay: 0.1s; }
                  .stat-row:nth-child(2) { animation-delay: 0.2s; }
                  .stat-row:nth-child(3) { animation-delay: 0.3s; }
                  .stat-row:nth-child(4) { animation-delay: 0.4s; }
                  .stat-row:nth-child(5) { animation-delay: 0.5s; }
                  .title { font: bold 18px 'Segoe UI', sans-serif; fill: #F85D7F; filter: url(#glow); }
                  .stat-label { font: 14px 'Segoe UI', sans-serif; fill: #8B949E; }
                  .stat-value { font: bold 14px 'Segoe UI', sans-serif; fill: #F8D866; }
                  .lang-label { font: 12px 'Segoe UI', sans-serif; fill: #C9D1D9; }
                  .lang-bar { animation: slideRight 1s ease forwards; rx: 3; ry: 3; }
                  .icon { fill: #F85D7F; animation: pulse 2s infinite; }
                  .border { rx: 10; ry: 10; }
                </style>
              </defs>

              <!-- Background -->
              <rect class="border" width="498" height="318" x="1" y="1" fill="url(#grad)" stroke="#F85D7F" stroke-width="1" stroke-opacity="0.3"/>

              <!-- Title -->
              <text class="title" x="250" y="35" text-anchor="middle">⚡ Shivam's GitHub Stats</text>

              <!-- Stats Grid -->
              <g class="stat-row" transform="translate(30, 60)">
                <text class="stat-label" x="0" y="15">⭐ Total Stars</text>
                <text class="stat-value" x="440" y="15" text-anchor="end">${totalStars}</text>
              </g>
              <g class="stat-row" transform="translate(30, 90)">
                <text class="stat-label" x="0" y="15">🍴 Total Forks</text>
                <text class="stat-value" x="440" y="15" text-anchor="end">${totalForks}</text>
              </g>
              <g class="stat-row" transform="translate(30, 120)">
                <text class="stat-label" x="0" y="15">📦 Public Repos</text>
                <text class="stat-value" x="440" y="15" text-anchor="end">${totalRepos}</text>
              </g>
              <g class="stat-row" transform="translate(30, 150)">
                <text class="stat-label" x="0" y="15">👥 Followers</text>
                <text class="stat-value" x="440" y="15" text-anchor="end">${followers}</text>
              </g>
              <g class="stat-row" transform="translate(30, 180)">
                <text class="stat-label" x="0" y="15">👤 Following</text>
                <text class="stat-value" x="440" y="15" text-anchor="end">${following}</text>
              </g>

              <!-- Separator -->
              <line x1="30" y1="210" x2="470" y2="210" stroke="#21262D" stroke-width="1"/>

              <!-- Languages Section -->
              <text class="stat-label" x="30" y="235" style="fill: #F85D7F; font-weight: bold;">Top Languages</text>

              <!-- Language Bar -->
              ${topLangs.map(([lang, bytes], i) => {
                const pct = ((bytes / totalBytes) * 100).toFixed(1);
                const prevPct = topLangs.slice(0, i).reduce((s, [, b]) => s + (b / totalBytes) * 100, 0);
                const color = langColors[lang] || '#8B949E';
                return `<rect class="lang-bar" x="${30 + (prevPct / 100) * 440}" y="245" width="${(pct / 100) * 440}" height="10" fill="${color}" style="animation-delay: ${0.5 + i * 0.1}s"/>`;
              }).join('\n              ')}

              <!-- Language Labels -->
              ${topLangs.map(([lang, bytes], i) => {
                const pct = ((bytes / totalBytes) * 100).toFixed(1);
                const color = langColors[lang] || '#8B949E';
                return `<g transform="translate(${30 + i * 90}, 275)">
                  <circle cx="5" cy="5" r="4" fill="${color}"/>
                  <text class="lang-label" x="14" y="9">${lang} ${pct}%</text>
                </g>`;
              }).join('\n              ')}

              <!-- Footer -->
              <text x="250" y="310" text-anchor="middle" style="font: 10px 'Segoe UI', sans-serif; fill: #484F58;">Updated: ${new Date().toISOString().split('T')[0]}</text>
            </svg>`;

            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/stats-card.svg', svg);
            console.log('Stats card generated!');

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
